<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="리니지의 직업과 군주 클래스 정보를 소개합니다."
    />
    <title>리니지 | 직업</title>
    <link rel="icon" href="assets/logo.png" />
    <link rel="stylesheet" href="job.css" />
  </head>
  <body class="job-page">
    <a class="skip-link" href="#class-introduction">직업 소개 바로가기</a>

    <div class="job-stage">
      <img
        class="class-artwork"
        src="assets/job-ruler.png"
        alt="검을 든 군주 클래스"
      />
      <!-- 헤더 영역 -->
      <header class="header">
      <a class="logo" href="index.html" aria-label="리니지 홈">
        <img class="logo-image" src="assets/logo.png" alt="리니지" />
      </a>

      <nav class="navigation" aria-label="주 메뉴">
        <ul class="nav-list">
          <li>
            <a class="nav-link active" href="index.html" aria-current="page"
              >소식</a
            >
          </li>
          <li><a class="nav-link" href="job.html">직업</a></li>
          <li class="nav-item-information">
            <a class="nav-link" href="info.html">정보▼</a>

            <!-- 히든카드 부분 -->

            <div class="information-card">
              <a href="contents.html" class="information-link">콘텐츠</a>
              <a href="region.html" class="information-link">지역</a>
              <a href="siege.html" class="information-link">공성전</a>
              <a href="media.html" class="information-link">미디어</a>
            </div>
          </li>
          <li><a class="nav-link" href="community.html">소통</a></li>
          <li><a class="nav-link" href="world.html">세계관</a></li>
          <li><a class="nav-link" href="shop.html">상점</a></li>
        </ul>
      </nav>

      <div class="header-actions">
        <button class="login-button" type="button">로그인</button>
        <img
          class="profile-image"
          src="assets/profile.png"
          alt="사용자 프로필"
        />
        <a
          class="download-button"
          href="https://lineage.plaync.com/download/index"
        >
          다운로드
        </a>
      </div>
    </header>

      <main class="class-content" id="class-introduction">
        <nav class="class-navigation" aria-label="직업 목록">
          <img class="class-timeline" src="assets/job-timeline.svg" alt="" />
          <ol class="class-list">
            <li class="class-item">
              <input class="class-choice" type="radio" name="job-class" id="class-ruler" value="ruler" checked />
              <label class="class-link" for="class-ruler">
                <span class="class-mark" aria-hidden="true"></span>군주
              </label>
            </li>
            <li class="class-item">
              <input class="class-choice" type="radio" name="job-class" id="class-knight" value="knight" />
              <label class="class-link" for="class-knight">
                <span class="class-mark" aria-hidden="true"></span>기사
              </label>
            </li>
            <li class="class-item">
              <input class="class-choice" type="radio" name="job-class" id="class-mage" value="mage" />
              <label class="class-link" for="class-mage">
                <span class="class-mark" aria-hidden="true"></span>마법사
              </label>
            </li>
            <li class="class-item">
              <input class="class-choice" type="radio" name="job-class" id="class-elf" value="elf" />
              <label class="class-link" for="class-elf">
                <span class="class-mark" aria-hidden="true"></span>요정
              </label>
            </li>
            <li class="class-item">
              <input class="class-choice" type="radio" name="job-class" id="class-dark-elf" value="dark-elf" />
              <label class="class-link" for="class-dark-elf">
                <span class="class-mark" aria-hidden="true"></span>다크엘프
              </label>
            </li>
            <li class="class-item">
              <input class="class-choice" type="radio" name="job-class" id="class-fighter" value="fighter" />
              <label class="class-link" for="class-fighter">
                <span class="class-mark" aria-hidden="true"></span>투사
              </label>
            </li>
            <li class="class-item">
              <input class="class-choice" type="radio" name="job-class" id="class-dark-knight" value="dark-knight" />
              <label class="class-link" for="class-dark-knight">
                <span class="class-mark" aria-hidden="true"></span>암흑기사
              </label>
            </li>
            <li class="class-item">
              <input class="class-choice" type="radio" name="job-class" id="class-holy-knight" value="holy-knight" />
              <label class="class-link" for="class-holy-knight">
                <span class="class-mark" aria-hidden="true"></span>신성기사
              </label>
            </li>
          </ol>
        </nav>

        <section class="class-introduction" id="ruler" aria-labelledby="class-title">
          <div class="introduction-heading">
            <span class="heading-diamond" aria-hidden="true"></span>
            <h1 class="class-title" id="class-title">전장의 마에스트로</h1>
            <img
              class="heading-arrow"
              src="assets/job-title-arrow.svg"
              alt=""
            />
          </div>

          <div class="introduction-panel">
            <span class="panel-diamond" aria-hidden="true"></span>
            <p class="class-description">
              리니지 시리즈의 주인공인 데포로쥬 반 아덴이 모티브이며,<br />
              리니지M 내에 있는 기능인 ‘혈맹’을 창설할 수 있는<br />
              유일한 클래스이다. 성주가 되어 강력한 권력을 누리고 싶은<br />
              야망가들이 선호하는 클래스이다.
            </p>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
