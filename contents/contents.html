<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="리니지의 영상 콘텐츠를 소개합니다." />
    <title>리니지 | 정보 · 콘텐츠</title>
    <link rel="icon" href="../assets/logo.png" />
    <link rel="stylesheet" href="../job/job.css" />
    <link rel="stylesheet" href="contents.css" />
    <script src="contents.js" defer></script>
    <link rel="stylesheet" href="../assets/header-navigation.css" />
  </head>

  <body class="contents-page">
    <a class="skip-link" href="#video-contents">영상 콘텐츠 바로가기</a>

    <div class="contents-stage">
      <header class="header">
        <a class="logo" href="../index/index.html" aria-label="리니지 홈">
          <img class="logo-image" src="../assets/logo.png" alt="리니지" />
        </a>

        <nav class="navigation" aria-label="주 메뉴">
          <ul class="nav-list">
            <li>
              <a class="nav-link" href="../index/index.html">소식</a>
            </li>
            <li>
              <a class="nav-link" href="../job/job.html">직업</a>
            </li>
            <li class="nav-item-information">
              <button class="nav-link active"
                 type="button" aria-controls="information-menu" aria-label="정보 메뉴 열기">정보▼</button>

              <!-- 히든카드 부분 -->

              <div class="information-card" id="information-menu">
                <a href="contents.html" class="information-link">콘텐츠</a>
                <a href="../region/region.html" class="information-link">지역</a>
                <a href="../siege/siege.html" class="information-link">공성전</a>
                <a href="../media/media.html" class="information-link">던전 및 보스</a>
              </div>
            </li>
            <li><span class="nav-link" role="link" aria-disabled="true" title="준비 중" aria-label="소통 (준비 중)">소통</span></li>
            <li><span class="nav-link" role="link" aria-disabled="true" title="준비 중" aria-label="세계관 (준비 중)">세계관</span></li>
            <li><span class="nav-link" role="link" aria-disabled="true" title="준비 중" aria-label="상점 (준비 중)">상점</span></li>
          </ul>
        </nav>

        <div class="header-actions">
          <a class="login-button" href="../login/login.html">로그인</a>
          <img
            class="profile-image"
            src="../assets/profile.png"
            alt="사용자 프로필"
          />
          <a
            class="download-button"
            href="https://lineage.plaync.com/download/index"
          >
            다운로드
          </a>
        </div>
      </header>

      <main class="contents-main" id="video-contents">
        <section class="video-gallery" aria-labelledby="video-title">
          <div class="video-heading">
            <img
              class="video-heading-line video-heading-line-left"
              src="../assets/title-left.png"
              alt=""
              width="249"
              height="17"
            />
            <h1 class="video-title" id="video-title">영상</h1>
            <img
              class="video-heading-line video-heading-line-right"
              src="../assets/title-right.png"
              alt=""
              width="259"
              height="18"
            />
          </div>

          <div class="video-strip" id="video-strip">
            <figure
              class="video-card video-card-featured"
              data-video-id="4AOxIDAGGdk"
            >
              <button
                class="video-trigger"
                type="button"
                aria-label="1번 영상 재생"
              >
                <img
                  class="video-thumbnail"
                  src="../assets/news-feature(1).png"
                  alt="황금빛 들판에 서 있는 붉은 망토의 리니지 W 기사"
                  width="747"
                  height="410"
                />
                <span class="video-play" aria-hidden="true"></span>
              </button>
            </figure>

            <figure
              class="video-card video-card-next"
              data-video-id="IwVPmm-RKqQ"
            >
              <button
                class="video-trigger"
                type="button"
                aria-label="2번 영상 재생"
              >
                <img
                  class="video-thumbnail"
                  src="../assets/contents-kent-night.jpg"
                  alt="별이 빛나는 밤의 켄트 성과 마을"
                  width="729"
                  height="410"
                />
                <span class="video-play" aria-hidden="true"></span>
              </button>
            </figure>

            <figure class="video-card" data-video-id="3K2fV6gqKsA">
              <button
                class="video-trigger"
                type="button"
                aria-label="3번 영상 재생"
              >
                <img
                  class="video-thumbnail"
                  src="../assets/news-feature(2).jpg"
                  alt="노을 아래 펼쳐진 리니지 W 성과 마을"
                  width="747"
                  height="411"
                />
                <span class="video-play" aria-hidden="true"></span>
              </button>
            </figure>

            <figure class="video-card" data-video-id="iqz44nmsZt8">
              <button
                class="video-trigger"
                type="button"
                aria-label="4번 영상 재생"
              >
                <img
                  class="video-thumbnail"
                  src="../assets/news-feature(3).jpg"
                  alt="숲속에 집결한 리니지 W 기사들"
                  width="747"
                  height="411"
                />
                <span class="video-play" aria-hidden="true"></span>
              </button>
            </figure>

            <figure
              class="video-card video-card-previous"
              data-video-id="fxqrlxrZKxQ"
            >
              <button
                class="video-trigger"
                type="button"
                aria-label="5번 영상 재생"
              >
                <img
                  class="video-thumbnail"
                  src="../assets/news-feature(5).jpg"
                  alt="리니지 W 로고 영상 썸네일"
                  width="731"
                  height="411"
                />
                <span class="video-play" aria-hidden="true"></span>
              </button>
            </figure>
          </div>

          <ol class="video-pagination" aria-label="영상 선택">
            <li class="video-pagination-item is-selected">
              <button
                class="video-pagination-button"
                type="button"
                aria-label="1번 영상 보기"
                aria-controls="video-strip"
                aria-pressed="true"
              >
                <span class="video-pagination-mark" aria-hidden="true"></span>
              </button>
            </li>
            <li class="video-pagination-item">
              <button
                class="video-pagination-button"
                type="button"
                aria-label="2번 영상 보기"
                aria-controls="video-strip"
                aria-pressed="false"
              >
                <span class="video-pagination-mark" aria-hidden="true"></span>
              </button>
            </li>
            <li class="video-pagination-item">
              <button
                class="video-pagination-button"
                type="button"
                aria-label="3번 영상 보기"
                aria-controls="video-strip"
                aria-pressed="false"
              >
                <span class="video-pagination-mark" aria-hidden="true"></span>
              </button>
            </li>
            <li class="video-pagination-item">
              <button
                class="video-pagination-button"
                type="button"
                aria-label="4번 영상 보기"
                aria-controls="video-strip"
                aria-pressed="false"
              >
                <span class="video-pagination-mark" aria-hidden="true"></span>
              </button>
            </li>
            <li class="video-pagination-item">
              <button
                class="video-pagination-button"
                type="button"
                aria-label="5번 영상 보기"
                aria-controls="video-strip"
                aria-pressed="false"
              >
                <span class="video-pagination-mark" aria-hidden="true"></span>
              </button>
            </li>
          </ol>
        </section>
      </main>
    </div>
  </body>
</html>
